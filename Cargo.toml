[workspace]
members = [
    "src-tauri",
    "crates/thalassa-domain",
    "crates/thalassa-policy",
    "crates/thalassa-ipc",
    "crates/thalassa-connectors",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["ThalassaOps contributors"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
