[package]
name = "thalassaops"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2", features = [] }
uuid.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
thalassa-domain = { path = "../crates/thalassa-domain" }
thalassa-ipc = { path = "../crates/thalassa-ipc" }
thalassa-policy = { path = "../crates/thalassa-policy" }
thalassa-connectors = { path = "../crates/thalassa-connectors" }
keyring = "3"
kube = { version = "0.96", features = ["client", "config", "rustls-tls"] }
k8s-openapi = { version = "0.23", features = ["v1_30"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_yaml = "0.9"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aws-config = { version = "=1.11.0" }
aws-sigv4 = { version = "=1.5.1" }
azure_identity = { version = "=1.0.0" }
gcp_auth = { version = "=0.12.7" }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"
